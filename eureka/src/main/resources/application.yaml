spring:
    application:
        name: eureka
server:
    port: 8761
eureka: 
    client:
        register-with-eureka: false
        fetch-registry: false
logging:
    level:
        com.netflix.eureka: OFF
        com.netflix.dicovery: OFF
management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus
    endpoint:
        prometheus:
            enabled: true
    prometheus:
        metrics:
            export:
                enabled: true