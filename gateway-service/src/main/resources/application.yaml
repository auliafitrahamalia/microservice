server:
  port: 9000

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: PRODUK
            uri: lb://PRODUK
            predicates:
              - Path=api/produk/**
          - id: ORDER-SERVICE
            uri: lb://ORDER
            predicates:
              - Path=api/order/**
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      default-zone: http://eureka:8761/eureka/
  instance:
    hostname: gateway
    
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true